<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancha Pedro Lira</title>
<meta name="theme-color" content="#1E6A47" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B5C3E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cancha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#F2F5F0; --card:#FFFFFF; --ink:#13241B; --ink2:#4E5F55; --line:#D9E1D6;
  --cancha:#1E6A47; --cancha-osc:#164F35; --raya:#FFFFFF; --accion:#1E6A47;
  --verde-suave:#DDEFE4; --verde-texto:#165536;
  --pelota:#D8EE4C; --pelota-ink:#283208;
  --fijo:#E5EAE3; --fijo-raya:#DAE1D7; --fijo-ink:#3F4D45;
  --bloq:#F4E4D7; --bloq-raya:#EEDACA; --bloq-ink:#7A4426;
  --rojo:#B4362A; --rojo-fondo:#B4362A; --wsp:#25D366;
  --row:56px; --gap:8px;
  --sombra:0 10px 30px rgba(19,36,27,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1612; --card:#17221C; --ink:#E7F0EA; --ink2:#A3B4AA; --line:#2A3A31;
    --cancha:#1B5C3E; --cancha-osc:#154831; --accion:#2E8B5F;
    --verde-suave:#1B3427; --verde-texto:#93E2B8;
    --fijo:#202B25; --fijo-raya:#27332C; --fijo-ink:#B4C2BA;
    --bloq:#36271E; --bloq-raya:#3F2E23; --bloq-ink:#EDBB98;
    --rojo:#F08A7E;
    --sombra:0 10px 30px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--pelota);outline-offset:2px}
input,select{font:inherit;font-size:16px}
[hidden]{display:none!important}

/* Cabecera: la cancha. Título, días y la línea blanca de fondo */
.cabecera{position:sticky;top:0;z-index:20;background:var(--cancha);color:#fff;padding:env(safe-area-inset-top) 0 12px}
.cabecera::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2px;background:var(--raya);border-radius:2px;opacity:.85}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;max-width:620px;margin:0 auto}
.pelota{width:28px;height:28px;border-radius:50%;background:var(--pelota);position:relative;flex:none;overflow:hidden}
.pelota::before,.pelota::after{content:"";position:absolute;top:-2px;width:28px;height:28px;border:2px solid rgba(255,255,255,.9);border-radius:50%}
.pelota::before{left:-19px}.pelota::after{right:-19px}
.pelota.grande{width:64px;height:64px}
.pelota.grande::before,.pelota.grande::after{width:64px;height:64px;border-width:3px}
.pelota.grande::before{left:-44px}.pelota.grande::after{right:-44px}
.titulos{flex:1;min-width:0;cursor:pointer}
.titulos h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulos p{margin:1px 0 0;font-size:15px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yo{flex:none;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:0 12px;font-size:16px;font-weight:650;min-height:48px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.yo:active{background:rgba(255,255,255,.26)}
.yo .adm{font-size:13px;font-weight:750;background:var(--pelota);color:var(--pelota-ink);border-radius:6px;padding:2px 6px}

/* Días: 8 chips que caben en 375 px. El elegido es la pelota: relleno, borde grueso y número más grande */
.dias{display:flex;padding:4px 4px 2px;max-width:620px;margin:0 auto}
.dia{flex:1 1 0;min-width:0;position:relative;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:4px 0}
.dia::before{content:"";position:absolute;inset:0 2px;border:1.5px solid rgba(255,255,255,.55);border-radius:12px}
.dia > b,.dia > span,.dia > i{position:relative}
.dia > b{display:block;font-size:13px;font-weight:600;line-height:16px}
.dia > span{display:block;font-size:20px;font-weight:700;line-height:25px;font-variant-numeric:tabular-nums}
.dia .marca{display:flex;gap:3px;align-items:center;justify-content:center;height:14px;font-style:normal;font-size:12px;font-weight:750;line-height:14px}
.dia .punto{display:block;width:8px;height:8px;border-radius:50%;background:var(--pelota);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.dia:active::before{background:rgba(255,255,255,.14)}
.dia.sel{color:var(--pelota-ink)}
.dia.sel::before{inset:-3px 1px;background:var(--pelota);border:3px solid #fff;border-radius:13px}
.dia.sel > span{font-size:23px;font-weight:800}
.dia.sel > b{font-weight:800}
.dia.sel .punto{background:var(--pelota-ink);box-shadow:none}

main{padding:14px 12px 120px;max-width:620px;margin:0 auto}

/* Título del día y avisos */
.diatit{margin:2px 2px 12px}
.diatit h2{margin:0;font-size:21px;font-weight:750;letter-spacing:-.01em;line-height:1.25}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;min-height:52px}
.aviso.fer{background:var(--bloq);border-color:transparent;color:var(--bloq-ink);padding:12px 14px}
.aviso button{color:var(--verde-texto);font-weight:750;min-height:48px;padding:0 10px;flex:none;border-radius:10px}
.liberado{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:48px;margin:0 0 10px;padding:12px 14px;border-radius:14px;background:var(--verde-suave);color:var(--verde-texto);font-size:15px;line-height:1.4;text-align:left}
.liberado .ico{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accion);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1}
.liberado b{font-weight:750}

/* Filas: la hora de inicio siempre a la izquierda, mismo tamaño y alineación */
.slot{width:100%;min-height:var(--row);margin:0 0 var(--gap);border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 9px 0 14px;text-align:left}
.hh{flex:none;width:52px;font-size:17px;font-weight:700;line-height:23px;font-variant-numeric:tabular-nums}
.cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.libre{background:var(--card);border:1.5px solid var(--line)}
.libre .cuerpo{font-size:15px;font-weight:600;color:var(--ink2)}
.libre .mas{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accion);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;line-height:1}
.libre:active{border-color:var(--cancha);background:var(--verde-suave)}
.libre.corto{background:transparent;border-color:transparent;min-height:44px;cursor:default}
.libre.corto .hh{color:var(--ink2);font-weight:600}
.bloque{align-items:flex-start;padding:16px 14px}
.bloque .t1{font-weight:750;font-size:17px;line-height:23px}
.bloque .t2{font-size:15px}
.fijo{background:repeating-linear-gradient(135deg,var(--fijo) 0 10px,var(--fijo-raya) 10px 20px);color:var(--fijo-ink)}
.bloqueo{background:repeating-linear-gradient(135deg,var(--bloq) 0 10px,var(--bloq-raya) 10px 20px);color:var(--bloq-ink)}
.res{background:var(--verde-suave);color:var(--verde-texto)}
.mia{background:var(--pelota);color:var(--pelota-ink);box-shadow:inset 0 0 0 2px rgba(40,50,8,.22)}
.pasado{opacity:.45;pointer-events:none}
.paso{display:flex;align-items:center;min-height:44px;padding:0 14px;margin:0 0 var(--gap);border-radius:14px;border:1.5px solid var(--line);color:var(--ink2);font-size:15px}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(8,18,12,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sombra);max-width:620px;margin:0 auto}
.hoja.on{transform:none}
.asa{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.hoja h2{margin:0 0 3px;font-size:22px;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 6px;font-size:15px}
.lbl{font-size:16px;font-weight:750;margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip:active{border-color:var(--cancha)}
.chip.sel{background:var(--cancha);border-color:var(--cancha);color:#fff}
.chip.sel::before{content:"✓";font-weight:800}
#chDur{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#chDur .chip{flex-direction:column;gap:1px;border-radius:14px;min-height:62px;padding:6px 4px}
#chDur .chip b{font-size:17px;font-weight:750}
#chDur .chip small{font-size:15px;font-weight:500}
#chDur .chip.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
#chDur .chip.sel::before{content:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:15px;font-weight:700;font-size:17px;margin-top:12px;padding:0 14px;text-align:center}
.btn.primario{background:var(--cancha);color:#fff;margin-top:22px;min-height:56px}
.btn.primario:active{background:var(--cancha-osc)}
.btn.primario:disabled{opacity:.45}
.btn.secundario{background:var(--bg);border:1.5px solid var(--line)}
.btn.peligro{color:var(--rojo);border:1.5px solid currentColor}
.btn.peligro.confirmar,.mini.confirmar{background:var(--rojo-fondo);color:#fff;border-color:var(--rojo-fondo)}
.cargando{opacity:.75;pointer-events:none}
.cargando::after{content:"";display:inline-block;width:16px;height:16px;margin-left:10px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.campo{width:100%;min-height:50px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;margin-top:10px}
.nota{color:var(--ink2);font-size:15px;margin:14px 0 0}

/* Toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:50;background:#13241B;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 10px 10px 16px;min-height:56px;box-shadow:var(--sombra);display:flex;gap:12px;align-items:center;justify-content:space-between;transform:translateY(16px);opacity:0;pointer-events:none;transition:.22s;max-width:596px;margin:0 auto;font-size:15px}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast.error{background:var(--rojo-fondo)}
.toast a{flex:none;display:inline-flex;align-items:center;min-height:44px;background:var(--wsp);color:#05301A;font-weight:750;border-radius:999px;padding:0 16px;text-decoration:none;font-size:15px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:650;color:var(--ink2);position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.sel{color:var(--verde-texto);font-weight:750}
.tab.sel::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--verde-texto)}
.tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--pelota);color:var(--pelota-ink);font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* Pantallas completas: ¿Quién eres? y carga */
.pantalla{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(32px + env(safe-area-inset-top)) 18px 40px}
.pantalla .inner{max-width:520px;margin:0 auto}
.pantalla h2{font-size:28px;margin:18px 0 4px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.nombre{min-height:60px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);font-size:17px;font-weight:650;padding:0 8px;text-align:center}
.nombre:active{background:var(--cancha);color:#fff;border-color:var(--cancha)}
#cargando{background:var(--cancha);color:#fff}
#cargando .sub{color:rgba(255,255,255,.9);font-size:16px}
#cargando .btn.primario{background:var(--pelota);color:var(--pelota-ink)}

/* Listas: Mis reservas y Admin */
.seccion{font-size:17px;font-weight:750;margin:16px 2px 10px}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tarjeta.propia{border-left:6px solid var(--pelota)}
.tf{font-weight:700;font-size:17px}
.tq{color:var(--ink2);font-size:15px;margin-top:2px}
.tq .ok{color:var(--verde-texto)}
.mini{flex:none;min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--bg)}
.mini.verde{background:var(--cancha);border-color:var(--cancha);color:#fff}
.mini.rojo{color:var(--rojo);border-color:currentColor;background:transparent}
.cupo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:6px;font-size:15px}
.vacio{text-align:center;padding:40px 18px;color:var(--ink2);font-size:15px}
.vacio .pelota{margin:0 auto 16px}
.vacio h3{color:var(--ink);margin:0 0 6px;font-size:21px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:18px}
.panel .sub{font-size:15px}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Clima (Open-Meteo). Si no carga, nada de esto aparece */
:root{--lluvia-bg:#DCEBFA;--lluvia-ink:#1B4F8F}
@media (prefers-color-scheme:dark){:root{--lluvia-bg:#1A2C42;--lluvia-ink:#A9CFF8}}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dia .clima{display:flex;align-items:center;justify-content:center;gap:2px;height:16px;font-style:normal;font-size:13px;font-weight:700;line-height:16px;font-variant-numeric:tabular-nums}
.climadia{display:flex;align-items:center;gap:6px;margin:4px 0 0;color:var(--ink2);font-size:15px;font-weight:600}
.climadia .ic{font-size:19px}
.tclima{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tclima .ic{font-size:18px}
.tclima .moja{display:inline-flex;align-items:center;gap:4px;background:var(--lluvia-bg);color:var(--lluvia-ink);border-radius:999px;padding:3px 9px 3px 7px;font-weight:750}
.bloque .tclima{color:inherit}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="cabecera">
  <header class="top">
    <div class="pelota" aria-hidden="true"></div>
    <div class="titulos" id="titulos" title="Actualizar">
      <h1 id="titulo">Cancha Pedro Lira</h1>
      <p id="subtitulo"></p>
    </div>
    <button class="yo" id="btnYo" aria-label="Mi perfil"></button>
  </header>
  <nav class="dias" id="dias" aria-label="Días"></nav>
</div>

<main id="vCancha">
  <div id="timeline"></div>
</main>
<main id="vMias" hidden></main>
<main id="vAdmin" hidden></main>

<nav class="tabbar">
  <button class="tab" data-v="cancha">
    <svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="1.5"/><path d="M4 12h16M8 2.5v19M16 2.5v19M8 7.5h8M8 16.5h8"/></svg>Cancha
  </button>
  <button class="tab" data-v="mias">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.8c3 2.6 3 9.8 0 12.4M18.4 5.8c-3 2.6-3 9.8 0 12.4"/></svg>Mis reservas<span class="badge" id="badge" hidden></span>
  </button>
  <button class="tab" data-v="admin" id="tabAdmin" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 2.8l7.5 3v5.6c0 4.6-3.1 8.4-7.5 9.8-4.4-1.4-7.5-5.2-7.5-9.8V5.8z"/><path d="M8.8 12l2.2 2.2 4.3-4.4"/></svg>Admin
  </button>
</nav>

<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"><div class="asa"></div><div id="hojaCont"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="pantalla" id="quien" hidden></div>
<div class="pantalla" id="cargando"><div class="inner"><div class="pelota grande"></div><h2>Cargando la cancha</h2><p class="sub" id="cargandoMsg">Un segundo…</p></div></div>

<script>
// URL de la app de Apps Script (la que termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbySx6snbU8AkAoFmLXqBLNr2Yogd0tfQhoWQ_0ULIzJaQMLXV3SK3LTp0cSu0HtDHMN/exec';
const BOOT = { yo: new URLSearchParams(location.search).get('yo') || '' };
let E = null;
let cargadoEn = Date.now();
let ultimoRefresco = Date.now();

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let yo = LS.get('cpl_yo', '');
let pin = LS.get('cpl_pin', '');
let recientes = LS.get('cpl_recientes', LS.get('cpl_otros', []));
let diaSel = 0;
let fechaSel = '';
const K = new URLSearchParams(location.search).get('k') || LS.get('cpl_k', '');
if (K) LS.set('cpl_k', K);
let vista = 'cancha';
let R = {};
const FA = { fecha: '', ini: '', fin: '', etiqueta: '', nombre: '' };

const DL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DP = ['domingos','lunes','martes','miércoles','jueves','viernes','sábados'];
const DC = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const ML = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const durTxt = d => d === 60 ? '1 h' : d === 90 ? '1 h 30' : '2 h';

function partes(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return { y, m, d, dow: new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay() };
}

let seq = 0, aplicado = 0;
async function api(fn, arg) {
  // credentials:'omit' evita el problema de Chrome con varias cuentas de Google
  const id = ++seq, ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  try {

      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, arg: arg === undefined ? null : arg, k: K })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); j._seq = id; return j;
  } finally { clearTimeout(to); }
}
function aplicar(r) {
  if (!r || !r.estado || r._seq < aplicado) return false;
  aplicado = r._seq; E = r.estado; cargadoEn = ultimoRefresco = Date.now();
  return true;
}
async function accion(fn, arg, btn) {

const CLIMA_URL = 'https://api.open-meteo.com/v1/forecast?latitude=-33.355&longitude=-70.525&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=America%2FSantiago&forecast_days=9';
let CL = null, climaIntento = 0;
async function cargarClima() {
  if (climaIntento && Date.now() - climaIntento < 30 * 60000) return;
  climaIntento = Date.now();
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(CLIMA_URL, { signal: ctl.signal, credentials: 'omit' });
    if (!r.ok) return;
    const j = await r.json();
    const h = {}, d = {};
    j.hourly.time.forEach((t, i) => { h[t] = { t: j.hourly.temperature_2m[i], p: j.hourly.precipitation_probability[i], c: j.hourly.weather_code[i] }; });

    CL = { h, d };

}

const NOMBRE_CLIMA = { sol: 'despejado', parcial: 'parcial', nublado: 'nublado', lluvia: 'lluvia', tormenta: 'tormenta' };
function tipoClima(c) {
  if (c == null) return '';

function ocupacion(d) {

function renderTimeline() {
  const d = E.dias[diaSel];
  const esHoy = d.fecha === E.hoy;
  const ahora = ahoraMin();
  const occ = ocupacion(d);
  const libs = d.bloques.filter(b => b.tipo === 'FIJO' && b.liberado && !(esHoy && b.fin <= ahora));
  const cuando = diaSel === 0 ? 'Hoy, ' : diaSel === 1 ? 'Mañana, ' : '';
  const cd = climaDia(d.fecha);
  const climaTit = cd ? `<p class="climadia">${icono(tipoClima(cd.c))}<span>${Math.round(cd.min)}° a ${Math.round(cd.max)}°${cd.p != null ? `, ${cd.p}% lluvia` : ''}</span></p>` : '';
  let h = `<div class="diatit"><h2>${cuando ? cuando + fechaLarga(d.fecha) : cap(fechaLarga(d.fecha))}</h2>${climaTit}</div>`;
  if (esHoy && ahora >= E.cierre - 30 && E.dias.length > 1) {
    h += `<div class="aviso"><span>Por hoy ya no quedan horarios.</span><button data-ir="1">Ver mañana</button></div>`;
  }
  if (d.feriado) {
    h += `<div class="aviso fer"><span><b>Feriado:</b> ${esc(d.feriado)}. Los horarios fijos no corren este día.</span></div>`;
  }
  libs.forEach(l => {
    h += `<button class="liberado" data-accion="liberado" data-ini="${l.inicio}"><span class="ico" aria-hidden="true">✓</span><span>No hay <b>${esc(l.etiqueta)}</b> este día${l.motivo ? ' (' + esc(l.motivo) + ')' : ''}. Libre de ${hhmm(l.inicio)} a ${hhmm(l.fin)}.</span></button>`;
  });
  // Hoy: todo lo que ya pasó va en una sola línea
  let pIni = -1, pFin = -1;
  const cerrarPasado = () => {
    if (pIni < 0) return;
    h += `<div class="paso">${hhmm(pIni)}${pFin > pIni ? ' a ' + hhmm(pFin) : ''}, ya pasó</div>`;
    pIni = -1;
  };

  while (t < E.cierre) {

    if (x) {
      const fin = Math.min(x.fin, E.cierre);

      if (esHoy && fin <= ahora) { if (pIni < 0) pIni = t; pFin = t; t = sig; continue; }

    </div>
    <button class="btn primario" id="btnOk"></button>`);
  pintarReserva();
  $('#chDur').onclick = e => { const c = e.target.closest('[data-dur]'); if (!c) return; R.dur = Number(c.dataset.dur); pintarReserva(); };
  $('#chPara').onclick = e => {
    const c = e.target.closest('[data-para]'); if (!c) return;
    if (c.dataset.para === '__otro') {
      R.panel = true; R.para = $('#buscaNom').value.trim();
      $('#panelOtro').hidden = false; $('#chTodos').innerHTML = chipsTodos($('#buscaNom').value);
    } else {
      R.panel = false; R.para = c.dataset.para; $('#panelOtro').hidden = true;
    }
    pintarReserva();
  };
  $('#chTodos').onclick = e => {
    const c = e.target.closest('[data-pick]'); if (!c) return;
    R.para = c.dataset.pick; $('#buscaNom').value = ''; $('#chTodos').innerHTML = chipsTodos('');
    pintarReserva();
  };
  $('#buscaNom').oninput = e => {
    R.para = e.target.value.trim(); $('#chTodos').innerHTML = chipsTodos(e.target.value);
    pintarReserva();
  };
  $('#btnOk').onclick = confirmarReserva;
}
function pintarReserva() {
  document.querySelectorAll('#chDur .chip').forEach(c => c.classList.toggle('sel', Number(c.dataset.dur) === R.dur));
  document.querySelectorAll('#chPara .chip').forEach(c => c.classList.toggle('sel', R.panel ? c.dataset.para === '__otro' : norm(c.dataset.para) === norm(R.para)));
  document.querySelectorAll('#chTodos .chip').forEach(c => c.classList.toggle('sel', c.dataset.pick === R.para));
  const para = String(R.para).trim();
  const lista = E.familia.filter(f => norm(f.nombre) !== norm(yo));
  const elegido = !R.panel || norm(para) === norm(yo) || lista.some(f => f.nombre === para);
  // Escrito a mano y parecido a alguien de la lista: obliga a tocar el nombre
  const aMedias = !elegido && para && lista.some(f => norm(f.nombre).startsWith(norm(para)));
  const b = $('#btnOk');
  b.textContent = aMedias ? 'Toca el nombre en la lista'
    : `Reservar ${hhmm(R.t)} a ${hhmm(R.t + R.dur)}` + (para && norm(para) !== norm(yo) ? ` para ${para}` : '');
  b.disabled = !para || aMedias;
}
async function confirmarReserva() {
  const para = String(R.para).trim();
  if (!para) return;
  const r = await accion('crearReserva', { fecha: R.fecha, inicio: R.t, duracion: R.dur, para }, $('#btnOk'));
  if (!r.ok) { toast(r.msg, 'error'); return; }
  if (norm(para) !== norm(yo)) { recientes = [para].concat(recientes.filter(n => norm(n) !== norm(para))).slice(0, 4); LS.set('cpl_recientes', recientes); }
  cerrarHoja();
  const wsp = `🎾 Reservé la cancha el ${fechaMedia(R.fecha)}, de ${hhmm(R.t)} a ${hhmm(R.t + R.dur)}${norm(para) === norm(yo) ? '' : ', para ' + para}.`;
  toast(r.msg + (r.avisos && r.avisos.length ? ' ' + r.avisos.join(' ') : ''), 'ok', wsp);
}

function armarCancelar(btn, id, textoConfirmar) {
  btn.onclick = async () => {
    if (!btn.classList.contains('confirmar')) { btn.classList.add('confirmar'); btn.textContent = textoConfirmar || 'Sí, cancelar'; return; }
    const r = await accion('cancelarReserva', { id }, btn);
    if (!r.ok) { toast(r.msg, 'error'); return; }
    cerrarHoja(); toast(r.msg);
  };
}

function abrirExistente(d, id) {
  const r = d.reservas.find(x => x.id === id); if (!r) return;
  const puede = adminActivo() || esMia(r);
  const por = norm(r.por) !== norm(r.para) ? `<br>Reservó ${esc(r.por)}` : '';
  abrirHoja(`
    <h2>${esc(r.para)}</h2>
    <p class="sub">${cap(fechaLarga(d.fecha))}, ${hhmm(r.inicio)} a ${hhmm(r.fin)}${por}</p>
    ${puede ? '<button class="btn peligro" id="btnCanc">Cancelar reserva</button>' : `<p class="nota">Si necesitas este horario, habla con ${esc(r.por)}.</p>`}
    <button class="btn secundario" data-cerrar="1">Cerrar</button>`);
  if (puede) armarCancelar($('#btnCanc'), id);
}

function abrirFijo(d, ini) {
  const b = d.bloques.find(x => x.tipo === 'FIJO' && x.inicio === ini); if (!b) return;
  const p = partes(d.fecha);
  let html = `<h2>${esc(b.etiqueta)}</h2><p class="sub">Todos los ${DP[p.dow]}, ${hhmm(b.inicio)} a ${hhmm(b.fin)}. Es un horario fijo, no se puede reservar.</p>`;
  if (adminActivo()) {
    html += `<input class="campo" id="motivo" maxlength="80" placeholder="Motivo (opcional), ej: fin de semana largo">
      <button class="btn primario" id="btnLib">Liberar solo el ${fechaMedia(d.fecha)}</button>`;
  } else if (soyAdmin()) {
    html += `<p class="nota">Para liberarlo un día, entra como admin tocando tu nombre arriba.</p>`;
  }
  html += `<button class="btn secundario" data-cerrar="1">Cerrar</button>`;
  abrirHoja(html);
  if (adminActivo()) {
    $('#btnLib').onclick = async () => {
      const r = await accion('adminLiberarFijo', { fecha: d.fecha, inicio: ini, fin: b.fin, motivo: $('#motivo').value }, $('#btnLib'));
      if (!r.ok) { toast(r.msg, 'error'); return; }
      cerrarHoja(); toast(r.msg, 'ok', r.whatsapp);
    };
  }
}

function abrirLiberado(d, ini) {
  const b = d.bloques.find(x => x.tipo === 'FIJO' && x.liberado && x.inicio === ini); if (!b) return;
  const excId = b.excId;
  let html = `<h2>${esc(b.etiqueta)}</h2><p class="sub">No va el ${fechaMedia(d.fecha)}${b.feriado ? ' porque es feriado (' + esc(d.feriado) + ')' : (b.motivo ? ' (' + esc(b.motivo) + ')' : '')}. De ${hhmm(b.inicio)} a ${hhmm(b.fin)} se puede reservar.</p>`;
  if (adminActivo() && excId) html += `<button class="btn secundario" id="btnDes">Deshacer: vuelve a ser fijo</button>`;
  if (adminActivo() && b.feriado) html += `<p class="nota">Si la clase sí va este feriado, bloquéala desde Admin → Bloquear un horario.</p>`;
  html += `<button class="btn secundario" data-cerrar="1">Cerrar</button>`;
  abrirHoja(html);
  if (adminActivo() && excId) {
    $('#btnDes').onclick = async () => {
      const r = await accion('adminDeshacerLiberacion', { excId }, $('#btnDes'));
      if (!r.ok) { toast(r.msg, 'error'); return; }
      cerrarHoja(); toast(r.msg);
    };
  }
}

function abrirBloqueo(d, id) {
  const b = d.bloques.find(x => x.tipo === 'BLOQUEO' && x.id === id); if (!b) return;
  let html = `<h2>${esc(b.etiqueta)}</h2><p class="sub">${cap(fechaLarga(d.fecha))}, ${hhmm(b.inicio)} a ${hhmm(b.fin)}. Cancha bloqueada.</p>`;
  if (adminActivo()) html += `<button class="btn peligro" id="btnQuitar">Quitar bloqueo</button>`;
  html += `<button class="btn secundario" data-cerrar="1">Cerrar</button>`;
  abrirHoja(html);
  if (adminActivo()) {
    $('#btnQuitar').onclick = async () => {
      const r = await accion('adminQuitarBloqueo', { id }, $('#btnQuitar'));
      if (!r.ok) { toast(r.msg, 'error'); return; }
      cerrarHoja(); toast(r.msg);
    };
  }
}

function abrirPerfil() {
  if (!yo) { mostrarQuien(); return; }
  let html = `<h2>${esc(yo)}</h2><p class="sub">${adminActivo() ? 'Modo admin activo en este celular.' : 'Este celular reserva como ' + esc(yo) + '.'}</p>
    <button class="btn secundario" id="pCambiar">Cambiar de persona</button>`;
  if (soyAdmin() && !adminActivo()) {
    html += `<p class="lbl">Entrar como admin</p>
      <input class="campo" id="pPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN de admin">
      <button class="btn primario" id="pEntrar">Entrar como admin</button>`;
  }
  if (adminActivo()) html += `<button class="btn secundario" id="pSalir">Salir de modo admin</button>`;
  abrirHoja(html);
  $('#pCambiar').onclick = () => { cerrarHoja(); mostrarQuien(); };
  if ($('#pSalir')) $('#pSalir').onclick = () => { salirAdmin(); cerrarHoja(); };
  if ($('#pEntrar')) {
    const entrar = async () => {
      const b = $('#pEntrar'); const v = $('#pPin').value.trim();
      if (!v) return;
      b.classList.add('cargando');
      let r;
      try { r = await api('verificarPin', v); } catch (e) { r = { ok: false, msg: 'No hay conexión.' }; }
      b.classList.remove('cargando');
      if (!r.ok) { toast(r.msg, 'error'); return; }
      pin = v; LS.set('cpl_pin', pin); cerrarHoja(); render();
      toast('Modo admin activo. Toca un horario fijo para liberarlo, o usa la pestaña Admin.');
    };
    $('#pEntrar').onclick = entrar;
    $('#pPin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  }
}
function salirAdmin() { pin = ''; LS.del('cpl_pin'); if (vista === 'admin') vista = 'cancha'; render(); toast('Saliste del modo admin.'); }

function mostrarQuien() {
  const s = $('#quien');
  s.innerHTML = `<div class="inner"><div class="pelota grande"></div><h2>¿Quién eres?</h2>
    <p class="sub">Se pregunta una sola vez en este celular.</p>
    ${E.familia.length > 10 ? '<input class="campo" id="buscaYo" autocomplete="off" placeholder="Busca tu nombre">' : ''}
    <div class="grid">${E.familia.map(f => `<button class="nombre" data-n="${esc(f.nombre)}">${esc(f.nombre)}</button>`).join('')}</div>
    <p class="nota">¿No estás en la lista? Pídele a ${esc(nombresAdmin())} que te agregue.</p></div>`;
  s.hidden = false;
  if ($('#buscaYo')) $('#buscaYo').oninput = e => {
    const f = norm(e.target.value);
    s.querySelectorAll('[data-n]').forEach(b => { b.hidden = !!f && !norm(b.dataset.n).includes(f); });
  };
  s.onclick = e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const antes = yo;
    yo = b.dataset.n; LS.set('cpl_yo', yo);
    if (norm(antes) !== norm(yo)) { pin = ''; LS.del('cpl_pin'); }
    s.hidden = true; render(); scrollAhora();
    toast(`Hola ${yo}. Toca un horario libre para reservar.`);
  };
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, tipo, wsp) {
  const el = $('#toast');
  el.className = 'toast on' + (tipo === 'error' ? ' error' : '');
  el.innerHTML = `<span>${esc(msg)}</span>${wsp ? `<a href="https://wa.me/?text=${encodeURIComponent(wsp)}" target="_blank" rel="noopener">Avisar al grupo</a>` : ''}`;
  clearTimeout(toastTimer);
  if (tipo !== 'error') toastTimer = setTimeout(() => el.classList.remove('on'), wsp ? 9000 : 4000);
  else if ($('#hoja').classList.contains('on')) toastTimer = setTimeout(() => el.classList.remove('on'), 8000);
}
$('#toast').addEventListener('click', e => { if (!e.target.closest('a')) $('#toast').classList.remove('on'); });

/* ---------- eventos ---------- */
$('#btnYo').addEventListener('click', abrirPerfil);
$('#dias').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  fechaSel = E.dias[Number(b.dataset.i)].fecha; render(); scrollAhora();
  b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
});
$('#timeline').addEventListener('click', e => {
  const ir = e.target.closest('[data-ir]');
  if (ir) { fechaSel = E.dias[Number(ir.dataset.ir)].fecha; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-accion]'); if (!b || b.disabled) return;
  const d = E.dias[diaSel]; const a = b.dataset.accion;
  if (a === 'libre') abrirReserva(d, Number(b.dataset.t));
  else if (a === 'res' || a === 'mia') abrirExistente(d, b.dataset.id);
  else if (a === 'fijo') abrirFijo(d, Number(b.dataset.ini));
  else if (a === 'bloqueo') abrirBloqueo(d, b.dataset.id);
  else if (a === 'liberado') abrirLiberado(d, Number(b.dataset.ini));
});
$('#hojaCont').addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) cerrarHoja(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  vista = t.dataset.v; render(); window.scrollTo(0, 0);
  if (vista === 'cancha') scrollAhora();
}));
$('#vMias').addEventListener('click', async e => {
  if (e.target.closest('[data-ir-cancha]')) { vista = 'cancha'; render(); scrollAhora(); return; }
  const b = e.target.closest('[data-cancel]'); if (!b) return;
  if (!b.classList.contains('confirmar')) {
    b.classList.add('confirmar'); b.textContent = '¿Seguro?';
    setTimeout(() => { if (document.body.contains(b)) { b.classList.remove('confirmar'); b.textContent = 'Cancelar'; } }, 10000);
    return;
  }
  const r = await accion('cancelarReserva', { id: b.dataset.cancel }, b);
  toast(r.msg, r.ok ? 'ok' : 'error');
});
$('#vAdmin').addEventListener('input', e => {
  const m = { aFecha: 'fecha', aIni: 'ini', aFin: 'fin', aEtiq: 'etiqueta', aNombre: 'nombre' }[e.target.id];
  if (m) FA[m] = e.target.value;
});
$('#vAdmin').addEventListener('change', e => {
  const m = { aFecha: 'fecha', aIni: 'ini', aFin: 'fin' }[e.target.id];
  if (m) FA[m] = e.target.value;
});
$('#vAdmin').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  let r = null;
  if (b.dataset.liberar) {
    const [fecha, ini, fin] = b.dataset.liberar.split('|');
    r = await accion('adminLiberarFijo', { fecha, inicio: Number(ini), fin: Number(fin), motivo: '' }, b);
    toast(r.msg, r.ok ? 'ok' : 'error', r.ok ? r.whatsapp : null); return;
  }
  if (b.dataset.deshacer) r = await accion('adminDeshacerLiberacion', { excId: b.dataset.deshacer }, b);
  else if (b.dataset.quitar) r = await accion('adminQuitarBloqueo', { id: b.dataset.quitar }, b);
  else if (b.id === 'aBloquear') {
    const ini = Number(FA.ini), fin = Number(FA.fin);
    if (fin <= ini) { toast('La hora de término debe ser después del inicio.', 'error'); return; }
    r = await accion('adminBloquear', { fecha: FA.fecha, inicio: ini, fin, etiqueta: FA.etiqueta || 'Bloqueado' }, b);
    if (r.ok) { FA.etiqueta = ''; render(); }
  } else if (b.id === 'aPersona') {
    if (!FA.nombre.trim()) { toast('Escribe un nombre.', 'error'); return; }
    r = await accion('adminAgregarPersona', { nombre: FA.nombre }, b);
    if (r.ok) { FA.nombre = ''; render(); }
  } else if (b.id === 'aSalir') { salirAdmin(); return; }
  if (r) toast(r.msg, r.ok ? 'ok' : 'error');
});

/* ---------- inicio ---------- */
$('#titulos').addEventListener('click', async () => {
  const ok = await refrescar();
  toast(ok ? 'Actualizado.' : 'No se pudo actualizar.', ok ? 'ok' : 'error');
});

async function iniciar() {
  cargarClima();
  const pc = $('#cargando');
  pc.hidden = false;
  $('#cargandoMsg').textContent = 'Un segundo…';
  const lento = setTimeout(() => { $('#cargandoMsg').textContent = 'La primera vez puede tardar unos segundos…'; }, 4000);
  let r;
  try { r = await api('getEstado'); } catch (e) { r = { ok: false, msg: 'No se pudo conectar. Revisa tu internet.' }; }
  clearTimeout(lento);
  if (!r || !r.ok) {
    $('#cargandoMsg').innerHTML = `${esc((r && r.msg) || 'No se pudo cargar.')}<br><br><button class="btn primario" id="reintentar">Reintentar</button>`;
    $('#reintentar').onclick = iniciar;
    return;
  }
  aplicar(r);
  if (BOOT.yo) {
    const f = E.familia.find(x => norm(x.nombre) === norm(BOOT.yo));
    if (f) { yo = f.nombre; LS.set('cpl_yo', yo); }
  }
  if (yo && !E.familia.some(f => norm(f.nombre) === norm(yo))) yo = '';
  pc.hidden = true;
  render();
  if (!yo) mostrarQuien(); else scrollAhora();
  // PIN guardado que ya no sirve (por ejemplo, si cambió en Config): se borra
  if (pin && soyAdmin()) api('verificarPin', pin).then(v => { if (v && !v.ok && /incorrecto/.test(v.msg)) { pin = ''; LS.del('cpl_pin'); render(); } }).catch(() => {});
}
iniciar();
</script>
</body>
</html>
